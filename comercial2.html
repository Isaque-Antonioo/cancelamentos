<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking de vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a0e;
    --card:#0c1218;
    --card-2:#090e13;
    --inset:#0d151b;
    --stage:#05090c;
    --line:#1a242e;
    --line-soft:#141d25;
    --ink:#eef4f6;
    --ink-2:#c7d2d8;
    --muted:#7d8b95;
    --dim:#5d6b75;
    --mint:#2fe3a6;
    --mint-2:#17b47e;
    --gold:#f5c93b;
    --silver:#b8c4cc;
    --bronze:#e88b3c;
    --coral:#e35d5d;
    --violet:#8b5cf6;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(47,227,166,.07), transparent 62%),
      radial-gradient(700px 420px at 12% 6%, rgba(139,92,246,.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Poppins",system-ui,-apple-system,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,input:focus-visible + .track{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}

  .app{min-height:100vh;display:flex;flex-direction:column;gap:12px;padding:12px;max-width:1680px;margin:0 auto}

  /* ---------- topbar ---------- */
  .topbar{
    position:relative;display:flex;align-items:center;justify-content:space-between;
    height:58px;padding:0 16px;
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 14px 34px rgba(0,0,0,.45);overflow:hidden;
  }
  .topbar::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--violet),#3b82f6 45%,var(--mint));
  }
  .brandmark{font-size:22px;filter:drop-shadow(0 0 10px rgba(245,201,59,.45))}
  .topbar h1{
    position:absolute;left:50%;transform:translateX(-50%);margin:0;
    display:flex;align-items:center;gap:10px;
    font-size:18px;font-weight:600;letter-spacing:.005em;white-space:nowrap;
  }
  .icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:color .15s,background .15s}
  .icon-btn:hover{color:var(--ink);background:rgba(255,255,255,.05)}

  .card{
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 14px 34px rgba(0,0,0,.45);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}

  .board{display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);gap:12px;flex:1;min-height:0}

  /* ---------- controles ---------- */
  .stage-head{display:flex;align-items:center;gap:12px;padding:13px 16px;flex-wrap:wrap}
  .ranking-id{display:flex;align-items:center;gap:11px;min-width:0;margin-right:auto}
  .badge-ring{width:34px;height:34px;border-radius:10px;flex:none;border:1px solid rgba(47,227,166,.3);background:rgba(47,227,166,.09);display:grid;place-items:center;color:var(--mint)}
  .ranking-id strong{display:block;font-size:14.5px;font-weight:600}
  .ranking-id span{display:block;font-size:11.5px;color:var(--dim)}

  .switch{display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:999px;background:var(--inset);border:1px solid var(--line);font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
  .switch input{position:absolute;opacity:0;pointer-events:none}
  .track{width:36px;height:20px;border-radius:999px;background:#212c35;position:relative;transition:background .2s;flex:none}
  .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#7d8b95;transition:transform .2s,background .2s}
  .switch input:checked + .track{background:rgba(47,227,166,.28)}
  .switch input:checked + .track::after{transform:translateX(16px);background:var(--mint)}

  /* ---------- palco ---------- */
  .stage{
    position:relative;flex:1;min-height:600px;margin:0 14px 14px;border-radius:12px;overflow:hidden;
    background:
      radial-gradient(58% 42% at 50% 80%, rgba(47,227,166,.16), transparent 70%),
      radial-gradient(90% 65% at 50% 118%, rgba(23,180,126,.18), transparent 70%),
      linear-gradient(180deg,#0a1014,var(--stage));
    border:1px solid var(--line);
  }
  .orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#5df0c0,#11705a 62%,#06201a);opacity:.55;animation:float 9s ease-in-out infinite}
  .orb.a{width:24px;height:24px;left:7%;bottom:13%}
  .orb.b{width:14px;height:14px;left:26%;bottom:6%;animation-delay:-3s}
  .orb.c{width:32px;height:32px;right:9%;bottom:9%;animation-delay:-5s}
  .orb.d{width:12px;height:12px;right:30%;bottom:19%;animation-delay:-1.5s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}

  .prizes{position:absolute;inset:6% 6% auto;display:flex;justify-content:space-between;align-items:flex-start}
  .prize{width:30%;text-align:center}
  .prize .disc{
    width:60px;height:60px;margin:0 auto 7px;border-radius:50%;
    background:linear-gradient(160deg,#16222a,#0a1116);
    border:1px solid rgba(184,196,204,.35);display:grid;place-items:center;font-size:24px;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  .prize small{font-size:11px;color:var(--muted);display:block;line-height:1.3}
  .prize b{display:block;color:var(--ink-2);font-weight:500;font-size:11.5px}
  .prize.center{order:2;margin-top:-6px}
  .prize.center .disc{width:72px;height:72px;font-size:29px;border-color:rgba(245,201,59,.6);box-shadow:0 0 24px rgba(245,201,59,.22)}
  .prize.center b{color:var(--gold)}

  /* ---------- pódio: colunas, card-estandarte e plintos ---------- */
  .podium{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;align-items:flex-end;gap:18px;padding:0 4%;z-index:2}
  .col{position:relative;display:flex;flex-direction:column;align-items:center}

  /* ===== rc-card: componente "estandarte" (moldura SVG + foto + placa de nome) =====
     Adaptado do componente enviado — tema por CSS custom properties, sem depender
     de clip-path. Cada instância recebe ids de gradiente únicos (sufixo por place)
     pra evitar colisão de <linearGradient id="..."> quando há 3 cards na mesma página. */
  .rc-card{
    --rc-body-1:#5157c4; --rc-body-2:#3a41a6; --rc-body-3:#1a2360; --rc-body-4:#0c1240;
    --rc-inner-glow:#8f93ee;
    --rc-halo:#1287c9; --rc-halo-hot:#45d6ff;
    --rc-gem-glow:#ffe79b;
    --rc-plate-bg-1:rgba(70,96,178,.42); --rc-plate-bg-2:rgba(28,44,104,.42);
    --rc-plate-br:rgba(158,184,242,.45);
    --rc-name:#ffffff;
    position:relative;width:var(--rc-w);aspect-ratio:200/290;flex:0 0 auto;
    font-family:inherit;-webkit-user-select:none;user-select:none;
  }
  .rc-card .rc-frame{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  .rc-card .rc-avatar{
    position:absolute;left:50%;top:35.9%;width:35.5%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;object-fit:cover;background:#0b1030;
    box-shadow:0 0 0 1.5px rgba(10,15,45,.9),0 0 0 2.5px rgba(158,178,240,.35),0 3px 10px rgba(0,0,0,.45),inset 0 0 14px rgba(0,0,0,.35);
  }
  .rc-card .rc-badge{
    position:absolute;left:60.5%;top:44%;width:9.5%;aspect-ratio:1/1.12;transform:translate(-50%,-50%);
    background:linear-gradient(180deg,#fff2c4 0%,#f6c95c 45%,#d99a26 100%);
    clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%);
    box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .rc-card .rc-badge::after{content:"";position:absolute;inset:22%;background:rgba(255,255,255,.45);clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%)}
  .rc-card .rc-name{
    position:absolute;left:28.2%;width:41.2%;top:55.5%;height:10.3%;
    display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0 4%;
    border-radius:calc(var(--rc-w) * .016);
    background:linear-gradient(180deg,var(--rc-plate-bg-1),var(--rc-plate-bg-2));
    border:1px solid var(--rc-plate-br);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.28);
    color:var(--rc-name);font-size:calc(var(--rc-w) * .046);font-weight:700;letter-spacing:.3px;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.55);
  }
  .rc-score{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--mint);text-align:center}

  /* 2º lugar — prata */
  .col.second .rc-card{
    --rc-body-1:#e8edf2; --rc-body-2:#aab4c0; --rc-body-3:#5a6672; --rc-body-4:#2b333c;
    --rc-inner-glow:#f2f6fa;
    --rc-halo:#7c92a8; --rc-halo-hot:#cfe0ee;
    --rc-plate-bg-1:rgba(140,150,160,.5); --rc-plate-bg-2:rgba(60,68,78,.5);
    --rc-plate-br:rgba(214,222,230,.55);
  }
  .col.second .rc-score{color:var(--silver)}

  /* 3º lugar — bronze/laranja (equivalente ao "red" do componente original, na nossa paleta) */
  .col.third .rc-card{
    --rc-body-1:#e08a4a; --rc-body-2:#c06a2c; --rc-body-3:#7d3f16; --rc-body-4:#4a230c;
    --rc-inner-glow:#ffcfa0;
    --rc-halo:#c9701e; --rc-halo-hot:#ff9d45;
    --rc-plate-bg-1:rgba(150,90,45,.92); --rc-plate-bg-2:rgba(92,50,22,.92);
    --rc-plate-br:rgba(255,206,178,.55);
  }
  .col.third .rc-score{color:var(--bronze)}

  /* 1º lugar — dourado (a base do componente vinha em índigo; sobrescrevendo pra ouro) */
  .col.first .rc-card{
    --rc-body-1:#fff6cf; --rc-body-2:#f7d271; --rc-body-3:#c9932c; --rc-body-4:#6b4a10;
    --rc-inner-glow:#fff3c4;
    --rc-plate-bg-1:rgba(180,140,40,.5); --rc-plate-bg-2:rgba(90,65,15,.5);
    --rc-plate-br:rgba(255,230,160,.55);
  }
  .col.first .rc-score{color:var(--gold);font-size:13.5px}

  /* plinto (base cilíndrica sob cada card) */
  .plinth{position:relative;width:78%;height:34px;margin-top:12px}
  .col.first .plinth{width:82%;height:48px;margin-top:14px}
  .plinth .foot{position:absolute;left:-10%;right:-10%;bottom:-10px;height:22px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(47,227,166,.3),transparent 72%)}
  .plinth .body{position:absolute;left:5%;right:5%;top:10px;bottom:5px;background:linear-gradient(90deg,#081318,#153039 48%,#081318);border-radius:0 0 46% 46%/0 0 22% 22%;border-bottom:1px solid rgba(47,227,166,.25)}
  .plinth .cap{position:absolute;left:0;right:0;top:0;height:20px;border-radius:50%;background:linear-gradient(180deg,#17323a,#0b181e);border:1px solid rgba(47,227,166,.45);box-shadow:0 0 20px rgba(47,227,166,.2), inset 0 2px 9px rgba(47,227,166,.2)}
  .col.first .plinth .cap{border-color:rgba(245,201,59,.5);box-shadow:0 0 24px rgba(245,201,59,.2), inset 0 2px 10px rgba(245,201,59,.16)}
  .col.second .plinth .cap{border-color:rgba(184,196,204,.5);box-shadow:0 0 20px rgba(184,196,204,.2), inset 0 2px 9px rgba(184,196,204,.16)}
  .col.third .plinth .cap{border-color:rgba(232,139,60,.5);box-shadow:0 0 20px rgba(232,139,60,.2), inset 0 2px 9px rgba(232,139,60,.16)}

  /* chão do palco */
  .floor{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:80%;height:120px;pointer-events:none;z-index:1}
  .floor .ring{position:absolute;left:50%;bottom:0;transform:translateX(-50%);border:1px solid rgba(47,227,166,.32);border-radius:50%}
  .floor .r1{width:44%;height:38px;bottom:18px;border-color:rgba(47,227,166,.65);box-shadow:0 0 22px rgba(47,227,166,.28);animation:pulse 3.4s ease-in-out infinite}
  .floor .r2{width:72%;height:60px;bottom:4px;opacity:.5}
  .floor .r3{width:100%;height:84px;bottom:-14px;opacity:.25}
  .floor .streak{position:absolute;left:-10%;right:-10%;bottom:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(47,227,166,.3),transparent)}
  .floor .streak.s2{bottom:12px;opacity:.6}
  @keyframes pulse{0%,100%{opacity:.4;transform:translateX(-50%) scale(.97)}50%{opacity:1;transform:translateX(-50%) scale(1.03)}}
  .glow-base{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);width:70%;height:54px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(47,227,166,.22),transparent 70%)}

  /* ---------- lista ---------- */
  .list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 11px;border-bottom:1px solid var(--line-soft)}
  .list-head h2{margin:0;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
  .list-head h2 svg{color:var(--mint)}
  .views{display:flex;gap:6px}
  .views button{width:32px;height:28px;border-radius:8px;background:var(--inset);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
  .views button[aria-pressed="true"]{background:rgba(47,227,166,.14);border-color:rgba(47,227,166,.4);color:var(--mint)}

  .list-wrap{flex:1;min-height:0;overflow:hidden;padding:11px 14px 14px}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:start}
  .list.single{grid-template-columns:1fr}
  .empty-hint{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:24px 0}

  .row{
    display:grid;grid-template-columns:40px 46px 1fr;align-items:center;gap:11px;
    background:var(--inset);border:1px solid var(--line);border-radius:12px;
    padding:9px 13px 9px 8px;min-height:64px;
  }
  .row.lead{border-color:rgba(47,227,166,.45);background:linear-gradient(90deg,rgba(47,227,166,.09),var(--inset) 55%)}
  .pos{font-size:17px;font-weight:600;text-align:center;color:var(--ink-2)}
  .crest{display:grid;place-items:center;font-size:20px}
  .row .face{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #263038}
  .row.lead .face{border-color:var(--mint)}
  .row .face img{width:100%;height:100%;display:block}
  .info{min-width:0}
  .info .who{font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .metrics{display:flex;gap:12px;font-size:11px;color:var(--dim);margin:2px 0 5px}
  .metrics b{font-weight:500;color:var(--ink-2)}
  .bar-line{display:flex;align-items:center;gap:9px}
  .bar{flex:1;height:7px;border-radius:999px;background:#131c23;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint-2),var(--mint));width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .pct{font-size:12px;font-weight:600;color:var(--mint);min-width:40px;text-align:right}
  .left-to-go{font-size:10.5px;color:var(--dim);margin-top:4px}
  .hide-score .metrics,.hide-score .left-to-go{display:none}

  /* ---------- trilha lateral ---------- */
  .rail{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;gap:5px;
    background:rgba(10,16,22,.85);border:1px solid var(--line);border-radius:999px;padding:8px 6px;
    backdrop-filter:blur(4px);
  }
  .rail button{width:34px;height:29px;border-radius:999px;font-size:11px;font-weight:500;color:var(--muted)}
  .rail button[aria-pressed="true"]{background:rgba(47,227,166,.16);color:var(--mint)}
  .rail .sep{width:18px;height:1px;background:var(--line);margin:3px 0}
  .rail .round{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(47,227,166,.1);color:var(--mint)}

  /* ---------- rodapé ---------- */
  .footer{
    display:flex;align-items:center;justify-content:flex-end;gap:12px;height:50px;padding:0 16px;
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 34px rgba(0,0,0,.45);
  }
  .ticker{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
  .ticker b{color:var(--mint);font-weight:600}
  .ticker .play{width:28px;height:28px;border-radius:50%;background:rgba(47,227,166,.14);border:1px solid rgba(47,227,166,.4);color:var(--mint);display:grid;place-items:center}

  /* ---------- banner última venda ---------- */
  .last-sale{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:4;
    display:flex;align-items:center;gap:10px;padding:7px 18px 7px 7px;border-radius:999px;
    background:linear-gradient(90deg,rgba(245,201,59,.16),rgba(47,227,166,.12));
    border:1px solid rgba(245,201,59,.4);box-shadow:0 8px 24px rgba(0,0,0,.35);
    transition:box-shadow .3s;max-width:88%;
  }
  .last-sale img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none}
  .last-sale span{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .last-sale b{color:var(--gold)}
  .last-sale.flash{animation:saleFlash 1.4s ease-in-out 2}
  @keyframes saleFlash{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.35)}50%{box-shadow:0 0 34px rgba(245,201,59,.6)}}

  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
  @media (max-width:1100px){
    .board{grid-template-columns:1fr}
    .list{grid-template-columns:1fr}
    .rail{position:static;transform:none;flex-direction:row;margin:0 14px 14px;align-self:center}
    .rail .sep{width:1px;height:18px;margin:0 3px}
    .topbar h1{position:static;transform:none}
  }
  @media (max-width:560px){
    .topbar h1{font-size:15px}
    .stage{min-height:400px}
    .prize small{font-size:10px}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <span class="brandmark" aria-hidden="true">🏆</span>
    <h1><span aria-hidden="true">🏆</span> Ranking de vendas</h1>
    <button class="icon-btn" title="Sair do modo TV" aria-label="Sair do modo TV">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <main class="board">

    <!-- ===== PÓDIO ===== -->
    <section class="card" aria-label="Pódio">
      <div class="stage-head">
        <div class="ranking-id">
          <span class="badge-ring">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M12 15v5"/><path d="M8 20h8"/></svg>
          </span>
          <span>
            <strong>Corrida de setembro</strong>
            <span>Pontuação por meta batida</span>
          </span>
        </div>
        <label class="switch">
          <input type="checkbox" id="ordPct">
          <span class="track"></span>
          Ord. por conversão
        </label>
        <label class="switch">
          <input type="checkbox" id="showScore" checked>
          <span class="track"></span>
          Exibir valores
        </label>
      </div>

      <div class="stage">
        <span class="orb a"></span><span class="orb b"></span><span class="orb c"></span><span class="orb d"></span>

        <div class="last-sale" id="lastSale" hidden></div>

        <div class="glow-base" aria-hidden="true"></div>
        <div class="floor" aria-hidden="true">
          <span class="streak"></span><span class="streak s2"></span>
          <span class="ring r3"></span><span class="ring r2"></span><span class="ring r1"></span>
        </div>
        <div class="podium" id="podium"></div>
      </div>
    </section>

    <!-- ===== LISTA ===== -->
    <section class="card" style="position:relative" aria-label="Classificação">
      <div class="list-head">
        <h2>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
          Classificação geral
        </h2>
        <div class="views" role="group" aria-label="Formato da lista">
          <button id="vSingle" aria-pressed="false" title="Uma coluna" aria-label="Uma coluna">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="3" rx="1"/><rect x="1" y="6.5" width="14" height="3" rx="1"/><rect x="1" y="11" width="14" height="3" rx="1"/></svg>
          </button>
          <button id="vGrid" aria-pressed="true" title="Duas colunas" aria-label="Duas colunas">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="6.2" height="5.5" rx="1"/><rect x="8.8" y="2" width="6.2" height="5.5" rx="1"/><rect x="1" y="8.8" width="6.2" height="5.5" rx="1"/><rect x="8.8" y="8.8" width="6.2" height="5.5" rx="1"/></svg>
          </button>
        </div>
      </div>

      <div class="list-wrap"><div class="list" id="list"></div></div>

      <nav class="rail" id="rail" aria-label="Tempo de troca de página">
        <button data-sec="10" aria-pressed="false">10s</button>
        <button data-sec="20" aria-pressed="true">20s</button>
        <button data-sec="30" aria-pressed="false">30s</button>
        <button data-sec="60" aria-pressed="false">1m</button>
        <button data-sec="120" aria-pressed="false">2m</button>
        <span class="sep"></span>
        <button class="round" id="refresh" title="Atualizar agora" aria-label="Atualizar agora">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
      </nav>
    </section>
  </main>

  <footer class="footer">
    <div class="ticker">
      <span id="tickerText">Próxima página em <b>20s</b></span>
      <button class="play" id="playPause" title="Pausar rotação" aria-label="Pausar rotação">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" id="ppIcon"><rect x="2" y="1.5" width="3" height="9" rx="1"/><rect x="7" y="1.5" width="3" height="9" rx="1"/></svg>
      </button>
    </div>
  </footer>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script>
(function(){
  "use strict";

  function hashOf(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}

  function avatar(nome){
    var h = hashOf(nome)%360;
    var ini = nome.split(" ").map(function(p){return p[0]}).slice(0,2).join("");
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">'+
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="hsl('+h+',38%,44%)"/><stop offset="1" stop-color="hsl('+((h+40)%360)+',42%,17%)"/></linearGradient></defs>'+
      '<rect width="80" height="80" fill="url(#g)"/>'+
      '<circle cx="40" cy="31" r="13" fill="rgba(255,255,255,.9)"/>'+
      '<path d="M9 80c4-19 16-28 31-28s27 9 31 28z" fill="rgba(255,255,255,.9)"/>'+
      '<text x="40" y="52" font-family="Poppins,sans-serif" font-size="24" font-weight="600" fill="hsl('+h+',35%,20%)" text-anchor="middle">'+ini+'</text></svg>';
    return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  }

  /* ---- Dados vêm do Firebase (/comercial2_live), alimentado pelo Apps Script ---- */
  /* Colunas da aba "Closer": A=Nome, B=Taxa de Conversão, C=Total de Vendas, D=Foto, E=Pendente */
  function parseMoneyValue(s){
    if (!s) return 0;
    return parseFloat(s.toString().replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".")) || 0;
  }
  function parsePercent(s){
    if (!s) return 0;
    return parseFloat(s.toString().replace("%","").replace(",",".")) || 0;
  }

  function mapPayload(payload){
    if (!payload || !payload.rows) return [];
    return payload.rows.map(function(r){
      var nome = (r[0] || "").toString().trim();
      var taxaLabel = (r[1] || "0%").toString().trim();
      var valorLabel = (r[2] || "R$ 0").toString().trim();
      var foto = (r[3] || "").toString().trim();
      var pendenteLabel = (r[4] || "R$ 0").toString().trim();
      return {
        nome: nome,
        pct: parsePercent(taxaLabel),
        pctLabel: taxaLabel,
        valor: parseMoneyValue(valorLabel),
        valorLabel: valorLabel,
        pendenteLabel: pendenteLabel,
        img: foto || avatar(nome || "?")
      };
    }).filter(function(d){ return d.nome; });
  }

  var dados = [];
  /* Ordena por Total de Vendas (R$) por padrão; toggle liga ordenação por Taxa de Conversão */
  var porPct = false, mostrarPontos = true, colunas = 2, segundos = 20, pagina = 0, rodando = true;

  var elList = document.getElementById("list");
  var elPodium = document.getElementById("podium");
  var elTicker = document.getElementById("tickerText");

  function ordenado(){
    return dados.slice().sort(function(a,b){
      return porPct ? (b.pct-a.pct || b.valor-a.valor) : (b.valor-a.valor);
    });
  }

  /* Moldura SVG do "estandarte" — as cores vêm de custom properties (--rc-*) definidas
     via CSS por posição, então o SVG em si é idêntico pra todo mundo. Cada card recebe
     um sufixo único (uid) nos ids do <defs>, porque url(#id) resolve pelo documento
     inteiro — sem isso, os 3 cards na mesma página acabariam usando sempre o gradiente
     do primeiro (bug clássico de reusar defs com o mesmo id em múltiplas instâncias). */
  function rcFrameSVG(uid){
    function id(base){ return base + uid; }
    return '<svg class="rc-frame" viewBox="0 0 200 290" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
      '<defs>'+
        '<linearGradient id="'+id('rcBody')+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="var(--rc-body-1)"/><stop offset="35%" stop-color="var(--rc-body-2)"/>'+
          '<stop offset="68%" stop-color="var(--rc-body-3)"/><stop offset="100%" stop-color="var(--rc-body-4)"/>'+
        '</linearGradient>'+
        '<radialGradient id="'+id('rcHalo')+'" cx="50%" cy="30%" r="58%">'+
          '<stop offset="0%" stop-color="var(--rc-inner-glow)" stop-opacity=".62"/>'+
          '<stop offset="100%" stop-color="var(--rc-inner-glow)" stop-opacity="0"/>'+
        '</radialGradient>'+
        '<linearGradient id="'+id('rcEdge')+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#fffdf4" stop-opacity="1"/><stop offset="22%" stop-color="#f4eeda" stop-opacity=".55"/>'+
          '<stop offset="62%" stop-color="#e8e0c6" stop-opacity=".16"/><stop offset="100%" stop-color="#e8e0c6" stop-opacity=".55"/>'+
        '</linearGradient>'+
        '<linearGradient id="'+id('rcGold')+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#fff6cf"/><stop offset="35%" stop-color="#f7d271"/>'+
          '<stop offset="70%" stop-color="#e2a930"/><stop offset="100%" stop-color="#b57c15"/>'+
        '</linearGradient>'+
        '<linearGradient id="'+id('rcRibbon')+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#ffd3b0"/><stop offset="12%" stop-color="#e8703a"/>'+
          '<stop offset="55%" stop-color="#b8402a"/><stop offset="100%" stop-color="#7a2418" stop-opacity="0"/>'+
        '</linearGradient>'+
        '<linearGradient id="'+id('rcArch')+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#fff4dc"/><stop offset="40%" stop-color="#e79a45"/><stop offset="100%" stop-color="#8e3118"/>'+
        '</linearGradient>'+
        '<filter id="'+id('rcSoft')+'" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.4"/></filter>'+
        '<filter id="'+id('rcGlow')+'" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1"/></filter>'+
        '<clipPath id="'+id('rcBodyClip')+'"><path d="M22,41 L178,41 L174,214 L100,249 L26,214 Z"/></clipPath>'+
      '</defs>'+
      '<g><circle cx="100" cy="156" r="99" fill="none" stroke="var(--rc-halo)" stroke-width="8" opacity=".32" filter="url(#'+id('rcSoft')+')"/>'+
        '<circle cx="100" cy="156" r="99" fill="none" stroke="var(--rc-halo-hot)" stroke-width="2.6" opacity=".8" filter="url(#'+id('rcGlow')+')"/>'+
        '<circle cx="100" cy="156" r="99" fill="none" stroke="#ddf7ff" stroke-width=".9" opacity=".75"/></g>'+
      '<g><path d="M14,43 L28,41 L25,150 L20,142 Z" fill="url(#'+id('rcRibbon')+')"/>'+
        '<path d="M16,43 L21,42.5 L20,118 L17.5,112 Z" fill="#ffd9b8" opacity=".3"/>'+
        '<path d="M186,43 L172,41 L175,150 L180,142 Z" fill="url(#'+id('rcRibbon')+')"/>'+
        '<path d="M184,43 L179,42.5 L180,118 L182.5,112 Z" fill="#ffe2c4" opacity=".35"/></g>'+
      '<path d="M22,41 L178,41 L174,214 L100,249 L26,214 Z" fill="url(#'+id('rcBody')+')"/>'+
      '<g clip-path="url(#'+id('rcBodyClip')+')"><rect x="22" y="41" width="156" height="150" fill="url(#'+id('rcHalo')+')"/></g>'+
      '<path d="M22,41 L26,214" fill="none" stroke="url(#'+id('rcEdge')+')" stroke-width="1.2"/>'+
      '<path d="M178,41 L174,214" fill="none" stroke="url(#'+id('rcEdge')+')" stroke-width="1.2"/>'+
      '<path d="M22,41 L178,41" stroke="#fffdf2" stroke-width="1.5" stroke-linecap="round"/>'+
      '<path d="M13,37 L27,41 L22.5,45.5 Z" fill="#fffdf2"/><path d="M187,37 L173,41 L177.5,45.5 Z" fill="#fffdf2"/>'+
      '<path d="M22,41 L22,49" stroke="#fffdf2" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>'+
      '<path d="M178,41 L178,49" stroke="#fffdf2" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>'+
      '<path d="M100,42 L83,37 L90,47 Z" fill="#f4faff" opacity=".95"/><path d="M100,42 L117,37 L110,47 Z" fill="#f4faff" opacity=".95"/>'+
      '<path d="M94,42 L100,54 L106,42 Z" fill="#0b1130" opacity=".6"/>'+
      '<path d="M94.5,42 L100,53 L105.5,42" fill="none" stroke="#dcecff" stroke-width=".6" opacity=".5"/>'+
      '<path d="M26,214 L100,249 L174,214" fill="none" stroke="#fff6e2" stroke-width="1.2" stroke-linejoin="round" opacity=".85"/>'+
      '<path d="M24,217 C36,224 60,236 100,254 C140,236 164,224 176,217" fill="none" stroke="url(#'+id('rcArch')+')" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<path d="M24.5,215.5 C36.5,222.5 60,234 100,251.5 C140,234 163.5,222.5 175.5,215.5" fill="none" stroke="#fff6e2" stroke-width=".8" opacity=".75" stroke-linecap="round"/>'+
      '<g><path d="M100,6 L110,26 L100,45 L90,26 Z" fill="var(--rc-gem-glow)" filter="url(#'+id('rcSoft')+')" opacity=".7"/>'+
        '<path d="M100,8 L109,26 L100,44 L91,26 Z" fill="url(#'+id('rcGold')+')" stroke="#fff8dd" stroke-width=".5"/>'+
        '<path d="M100,14 L104.5,26 L100,38 L95.5,26 Z" fill="#fff6cd" opacity=".5"/></g>'+
      '<g><path d="M100,251 L111,263 L100,275 L89,263 Z" fill="var(--rc-gem-glow)" filter="url(#'+id('rcSoft')+')" opacity=".6"/>'+
        '<path d="M100,253 L110,263 L100,274 L90,263 Z" fill="url(#'+id('rcGold')+')" stroke="#fff8dd" stroke-width=".5"/>'+
        '<path d="M100,257 L104,263 L100,269 L96,263 Z" fill="#fff6cd" opacity=".45"/>'+
        '<path d="M85,260 L90,263 L85,266 Z" fill="url(#'+id('rcGold')+')" opacity=".9"/>'+
        '<path d="M115,260 L110,263 L115,266 Z" fill="url(#'+id('rcGold')+')" opacity=".9"/></g>'+
    '</svg>';
  }

  function coluna(d, place){
    var cls = place===1 ? "first" : place===2 ? "second" : "third";
    var w = place===1 ? 230 : 180;
    var linha = mostrarPontos
      ? (porPct ? d.pctLabel+" conversão" : d.valorLabel) : "";
    return '<div class="col '+cls+'">'+
      '<div class="rc-card" style="--rc-w:'+w+'px">'+
        rcFrameSVG("-p"+place)+
        '<img class="rc-avatar" alt="" src="'+d.img+'">'+
        '<span class="rc-badge"></span>'+
        '<div class="rc-name">'+d.nome+'</div>'+
      '</div>'+
      (linha ? '<div class="rc-score">'+linha+'</div>' : '')+
      '<div class="plinth" aria-hidden="true"><span class="foot"></span><span class="body"></span><span class="cap"></span></div>'+
    '</div>';
  }

  function renderPodium(top){
    var html = "";
    if (top[1]) html += coluna(top[1],2);
    if (top[0]) html += coluna(top[0],1);
    if (top[2]) html += coluna(top[2],3);
    elPodium.innerHTML = html || '<p style="color:var(--muted);text-align:center;width:100%">Aguardando dados da planilha…</p>';
  }

  function porPagina(){ return colunas===2 ? 16 : 8; }

  function renderList(){
    var resto = ordenado().slice(3);
    var tam = porPagina();
    var totalPag = Math.max(1, Math.ceil(resto.length/tam));
    if(pagina >= totalPag) pagina = 0;
    var fatia = resto.slice(pagina*tam, pagina*tam+tam);

    elList.className = "list" + (colunas===1?" single":"") + (mostrarPontos?"":" hide-score");

    if (dados.length === 0) {
      elList.innerHTML = '<p class="empty-hint">Aguardando dados da planilha…</p>';
      return;
    }

    elList.innerHTML = fatia.map(function(p,i){
      var posicao = 4 + pagina*tam + i;
      var lider = posicao===4 && pagina===0;
      var marca = posicao<=6 ? '<div class="crest" aria-hidden="true">🛡️</div>' : '<div class="pos">'+posicao+'</div>';
      return '<article class="row'+(lider?" lead":"")+'">'+marca+
        '<div class="face"><img alt="" src="'+p.img+'"></div>'+
        '<div class="info">'+
          '<div class="who">'+p.nome+'</div>'+
          '<div class="metrics"><span>Vendas <b>'+p.valorLabel+'</b></span><span>Pendente <b>'+p.pendenteLabel+'</b></span></div>'+
          '<div class="bar-line"><span class="bar"><i data-w="'+Math.min(100,p.pct)+'"></i></span><span class="pct">'+p.pctLabel+'</span></div>'+
        '</div></article>';
    }).join("");

    requestAnimationFrame(function(){
      Array.prototype.forEach.call(elList.querySelectorAll(".bar i"), function(b){
        b.style.width = b.getAttribute("data-w")+"%";
      });
    });
  }

  function renderAll(){
    var todos = ordenado();
    renderPodium(todos.slice(0,3));
    renderList();
  }

  var restante = segundos;
  function pinta(){ elTicker.innerHTML = rodando ? 'Próxima página em <b>'+restante+'s</b>' : 'Rotação pausada'; }
  setInterval(function(){
    if(!rodando) return;
    restante--;
    if(restante<=0){ pagina++; renderList(); restante = segundos; }
    pinta();
  },1000);

  document.getElementById("ordPct").addEventListener("change",function(e){
    porPct = e.target.checked; pagina = 0; renderAll();
  });
  document.getElementById("showScore").addEventListener("change",function(e){
    mostrarPontos = e.target.checked; renderAll();
  });
  document.getElementById("vGrid").addEventListener("click",function(){
    colunas = 2; pagina = 0;
    this.setAttribute("aria-pressed","true");
    document.getElementById("vSingle").setAttribute("aria-pressed","false");
    renderList();
  });
  document.getElementById("vSingle").addEventListener("click",function(){
    colunas = 1; pagina = 0;
    this.setAttribute("aria-pressed","true");
    document.getElementById("vGrid").setAttribute("aria-pressed","false");
    renderList();
  });
  document.getElementById("rail").addEventListener("click",function(e){
    var b = e.target.closest("button[data-sec]"); if(!b) return;
    Array.prototype.forEach.call(this.querySelectorAll("button[data-sec]"),function(x){
      x.setAttribute("aria-pressed", String(x===b));
    });
    segundos = parseInt(b.getAttribute("data-sec"),10);
    restante = segundos; pinta();
  });
  document.getElementById("refresh").addEventListener("click",function(){
    if (typeof firebase === "undefined" || !firebase.apps || !firebase.apps.length) return;
    firebase.database().ref("comercial2_live").once("value").then(function(snap){
      dados = mapPayload(snap.val());
      pagina = 0; renderAll();
    });
    firebase.database().ref("comercial2_ultima_venda").once("value").then(function(snap){
      renderLastSale(snap.val());
    });
  });
  document.getElementById("playPause").addEventListener("click",function(){
    rodando = !rodando;
    this.title = rodando ? "Pausar rotação" : "Retomar rotação";
    this.setAttribute("aria-label", this.title);
    document.getElementById("ppIcon").innerHTML = rodando
      ? '<rect x="2" y="1.5" width="3" height="9" rx="1"/><rect x="7" y="1.5" width="3" height="9" rx="1"/>'
      : '<path d="M3 1.5 10.5 6 3 10.5z"/>';
    pinta();
  });

  /* ---- Firebase: escuta o ranking em tempo real ---- */
  function initComercial2(){
    firebase.database().ref("comercial2_live").on("value", function(snap){
      dados = mapPayload(snap.val());
      pagina = 0;
      renderAll();
    });
  }

  /* ---- Banner de celebração: última venda registrada (/comercial2_ultima_venda) ---- */
  var elLastSale = document.getElementById("lastSale");
  var lastSaleKey = null; // evita re-piscar quando o mesmo valor é re-recebido

  function renderLastSale(v){
    if (!v || !v.closer) { elLastSale.hidden = true; return; }

    var img = v.foto || avatar(v.closer);
    elLastSale.innerHTML = '🎉 <img alt="" src="'+img+'">'+
      '<span><b>'+v.closer+'</b> vendeu <b>'+(v.valor || "R$ 0")+'</b>!</span>';
    elLastSale.hidden = false;

    var key = v.updatedAt || (v.closer+"|"+v.valor);
    if (key !== lastSaleKey) {
      lastSaleKey = key;
      elLastSale.classList.remove("flash");
      requestAnimationFrame(function(){ elLastSale.classList.add("flash"); });
      setTimeout(function(){ elLastSale.classList.remove("flash"); }, 3000);
    }
  }

  function initUltimaVenda(){
    firebase.database().ref("comercial2_ultima_venda").on("value", function(snap){
      renderLastSale(snap.val());
    });
  }

  /* ---- Meta do time (aba "Dados" → /comercial2_dados) — AINDA DESATIVADO ----
     Os dados já chegam sincronizados pelo Apps Script; quando quiserem exibir a
     faixa de progresso do time, é só descomentar o bloco abaixo (e o HTML/CSS
     correspondente) — nenhuma mudança no Apps Script é necessária.

  function initDadosTime(){
    firebase.database().ref("comercial2_dados").on("value", function(snap){
      var d = snap.val();
      if (!d) return;
      // Ex.: preencher uma faixa "Total <d.total> de <d.meta>" no topo da página
    });
  }
  ------------------------------------------------------------------------------- */

  renderAll(); // estado inicial (vazio, "aguardando dados")

  document.addEventListener("DOMContentLoaded", function(){
    if (typeof firebase !== "undefined" && firebase.apps && firebase.apps.length) {
      initComercial2();
      initUltimaVenda();
      // initDadosTime(); // descomentar junto com o bloco acima quando for ativar
    } else {
      document.addEventListener("hubstromFirebaseReady", function(){
        initComercial2();
        initUltimaVenda();
      });
    }
  });
})();
</script>
</body>
</html>
